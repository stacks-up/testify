# Checks that the pull request title and every commit in the pull request
# follow Conventional Commits (https://www.conventionalcommits.org):
#
#   <type>[(scope)][!]: <description>
#
# Merge commits are skipped. Inline shell only, so no third-party actions.
name: Conventional Commits

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    # This name is the status check to require in the main branch ruleset.
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title and commit messages
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed via env, never interpolated into the script, so a crafted
          # title can't inject shell.
          TITLE: ${{ github.event.pull_request.title }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/-]+\))?!?: [^ ].*$'
          hint='Expected "<type>[(scope)][!]: <description>", where type is one of build, chore, ci, docs, feat, fix, perf, refactor, revert, style, test.'
          failed=0

          if grep -qE "$pattern" <<< "$TITLE"; then
            echo "ok    PR title: $TITLE"
          else
            echo "::error title=PR title is not a Conventional Commit::\"$TITLE\". $hint"
            failed=1
          fi

          # One line per non-merge commit: "<short sha> <subject>".
          commits=$(gh api "repos/$REPO/pulls/$PR/commits" --paginate \
            --jq '.[] | select(.parents | length == 1) | .sha[0:7] + " " + (.commit.message | split("\n")[0])')
          while read -r sha subject; do
            [ -n "$sha" ] || continue
            if grep -qE "$pattern" <<< "$subject"; then
              echo "ok    $sha $subject"
            else
              echo "::error title=Commit $sha is not a Conventional Commit::\"$subject\". $hint"
              failed=1
            fi
          done <<< "$commits"

          exit $failed
